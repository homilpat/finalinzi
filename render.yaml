services:
  - type: web
    name: moca-demo
    runtime: python
    rootDir: giukhaji
    pythonVersion: "3.10.6"
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_PASSWORD
        sync: false
      - key: PHONE_HASH_SALT
        generateValue: true
